{% load voting_tags %}
{% csrf_token %}
<div class="compact-voting" id="voting-{{ answer.id }}">
    {% get_answer_vote user_answer_votes answer.id as current_vote %}

    <button class="voting-btn vote-up {% if current_vote == 'like' %}active{% endif %}"
            hx-post="{% url 'vote_answer' answer.id %}"
            hx-vals='{"type": "like", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="#voting-{{ answer.id }}"
            hx-swap="outerHTML">
        <svg class="voting-icon" width="12" height="12" viewBox="0 0 18 18">
            <path d="M1 12h16L9 4z"></path>
        </svg>
    </button>

    <span class="voting-count {% if answer.votes > 0 %}positive{% elif answer.votes < 0 %}negative{% endif %}">
        {{ answer.rating }}
    </span>

    <button class="voting-btn vote-down {% if current_vote == 'dislike' %}active{% endif %}"
            hx-post="{% url 'vote_answer' answer.id %}"
            hx-vals='{"type": "dislike", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="#voting-{{ answer.id }}"
            hx-swap="outerHTML">
        <svg class="voting-icon" width="12" height="12" viewBox="0 0 18 18">
            <path d="M1 6h16l-8 8z"></path>
        </svg>
    </button>
    
</div>
